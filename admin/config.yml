backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "sell"
    label: "املاک فروش"
    folder: "content/sell"
    create: true
    fields:
      - { label: "عنوان", name: "title", widget: "string" }
      - { label: "مکان", name: "location", widget: "string" }
      - { label: "قیمت", name: "price", widget: "string" }
      - { label: "تصویر", name: "image", widget: "image" }
      - { label: "ویژگی‌ها", name: "features", widget: "list", field: { label: "ویژگی", name: "feature", widget: "string" } }

  - name: "rent"
    label: "املاک اجاره"
    folder: "content/rent"
    create: true
    fields:
      - { label: "عنوان", name: "title", widget: "string" }
      - { label: "مکان", name: "location", widget: "string" }
      - { label: "قیمت", name: "price", widget: "string" }
      - { label: "تصویر", name: "image", widget: "image" }
      - { label: "ویژگی‌ها", name: "features", widget: "list", field: { label: "ویژگی", name: "feature", widget: "string" } }

  - name: "calculator"
    label: "تنظیمات محاسبه‌گر"
    folder: "content/calculator"
    create: false
    fields:
      - { label: "قیمت هر متر (تومان)", name: "pricePerMeter", widget: "number", default: 150000000 }
      - { label: "درصد کمیسیون", name: "commissionPercent", widget: "number", default: 2.5 }
