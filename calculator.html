<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاسبه‌گر املاک | ایران قهرمان</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
font-family: system-ui, 'Tahoma', sans-serif;
min-height: 100vh;
padding: 2rem 1rem;
}

.container {
max-width: 800px;
margin: 0 auto;
}

/* header */
.header {
text-align: center;
margin-bottom: 2rem;
}

.header h1 {
color: #facc15;
font-size: 1.8rem;
margin-bottom: 0.5rem;
}

.header p {
color: #94a3b8;
font-size: 0.9rem;
}

/* تب‌ها */
.tabs {
display: flex;
gap: 1rem;
margin-bottom: 2rem;
background: #1e293b;
padding: 0.5rem;
border-radius: 1rem;
}

.tab-btn {
flex: 1;
padding: 0.75rem;
background: transparent;
border: none;
color: #94a3b8;
font-size: 1rem;
font-weight: bold;
border-radius: 0.75rem;
cursor: pointer;
transition: all 0.3s ease;
}

.tab-btn.active {
background: #facc15;
color: #0f172a;
}

/* کارت محاسبه‌گر */
.calculator-card {
background: rgba(30, 41, 59, 0.9);
backdrop-filter: blur(4px);
border-radius: 1.5rem;
padding: 1.5rem;
border: 1px solid #334155;
}

.input-group {
margin-bottom: 1.5rem;
}

.input-group label {
display: block;
color: #cbd5e1;
margin-bottom: 0.5rem;
font-size: 0.9rem;
}

.input-group input {
width: 100%;
padding: 0.8rem;
background: #0f172a;
border: 1px solid #334155;
border-radius: 0.75rem;
color: #f1f5f9;
font-size: 1rem;
direction: ltr;
text-align: right;
}

.input-group input:focus {
outline: none;
border-color: #facc15;
}

/* دکمه محاسبه */
.calculate-btn {
width: 100%;
padding: 0.8rem;
background: #facc15;
border: none;
border-radius: 0.75rem;
color: #0f172a;
font-size: 1rem;
font-weight: bold;
cursor: pointer;
transition: transform 0.2s;
}

.calculate-btn:hover {
transform: scale(1.02);
}

/* نتیجه */
.result-box {
margin-top: 1.5rem;
padding: 1.5rem;
background: #0f172a;
border-radius: 1rem;
text-align: center;
}

.result-label {
color: #94a3b8;
font-size: 0.85rem;
margin-bottom: 0.5rem;
}

.result-value {
color: #facc15;
font-size: 1.8rem;
font-weight: bold;
}

.result-detail {
color: #64748b;
font-size: 0.75rem;
margin-top: 0.5rem;
}

.note {
margin-top: 1.5rem;
padding: 0.75rem;
background: #1e293b;
border-radius: 0.75rem;
text-align: center;
font-size: 0.7rem;
color: #94a3b8;
}

footer {
text-align: center;
margin-top: 2rem;
color: #475569;
font-size: 0.7rem;
}

@media (max-width: 640px) {
.container {
padding: 0;
}
.result-value {
font-size: 1.3rem;
}
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🧮 محاسبه‌گر املاک</h1>
<p>کمیسیون فروش و اجاره | ایران قهرمان</p>
</div>

<!-- تب‌ها -->
<div class="tabs">
<button class="tab-btn active" id="saleTabBtn">🏠 فروش ملک</button>
<button class="tab-btn" id="rentTabBtn">🔑 اجاره ملک</button>
</div>

<!-- محاسبه‌گر فروش -->
<div id="saleCalculator" class="calculator-card">
<div class="input-group">
<label>💰 مبلغ فروش (تومان)</label>
<input type="text" id="saleAmount" placeholder="مثال: 2000000000">
</div>
<button class="calculate-btn" id="calcSaleBtn">محاسبه کمیسیون</button>

<div class="result-box" id="saleResult">
<div class="result-label">جمع کل دریافتی مشاور</div>
<div class="result-value" id="saleTotal">-</div>
<div class="result-detail" id="saleDetail"></div>
</div>
</div>

<!-- محاسبه‌گر اجاره -->
<div id="rentCalculator" class="calculator-card" style="display: none;">
<div class="input-group">
<label>🏦 پول پیش (تومان)</label>
<input type="text" id="rentDeposit" placeholder="مثال: 500000000">
</div>
<div class="input-group">
<label>📅 اجاره ماهانه (تومان)</label>
<input type="text" id="rentMonthly" placeholder="مثال: 2000000">
</div>
<button class="calculate-btn" id="calcRentBtn">محاسبه کمیسیون</button>

<div class="result-box" id="rentResult">
<div class="result-label">جمع کل دریافتی مشاور</div>
<div class="result-value" id="rentTotal">-</div>
<div class="result-detail" id="rentDetail"></div>
</div>
</div>

<div class="note">
⚡ قوانین محاسبه:<br>
• فروش: ۰.۲۵٪ از خریدار + ۰.۲۵٪ از فروشنده = ۰.۵٪ + ۱۰٪ مالیات<br>
• اجاره: هر ۱۰۰ میلیون رهن = ۳ میلیون اجاره | یک‌چهارم مبلغ پایه + ۱۰٪ مالیات
</div>
<footer>
© 2026 ایران قهرمان | مشاور املاک
</footer>
</div>

<script>
// تابع تبدیل عدد با کاما و جداسازی
function parseNumber(value) {
return parseInt(value.replace(/,/g, '')) || 0;
}

function formatNumber(num) {
return num.toLocaleString('fa-IR');
}

// ==================== فروش ====================
function calculateSale() {
let saleAmount = parseNumber(document.getElementById('saleAmount').value);

if (saleAmount <= 0) {
document.getElementById('saleTotal').innerHTML = '❌ مقدار نامعتبر';
document.getElementById('saleDetail').innerHTML = '';
return;
}

const commission = saleAmount * 0.005; // 0.5%
const tax = commission * 0.10; // 10%
const total = commission + tax;

document.getElementById('saleTotal').innerHTML = formatNumber(total) + ' تومان';
document.getElementById('saleDetail').innerHTML = کمیسیون: ${formatNumber(commission)} | مالیات: ${formatNumber(tax)};
}

// ==================== اجاره ====================
function calculateRent() {
let deposit = parseNumber(document.getElementById('rentDeposit').value);
let monthlyRent = parseNumber(document.getElementById('rentMonthly').value);

if (deposit <= 0 && monthlyRent <= 0) {
document.getElementById('rentTotal').innerHTML = '❌ مقدار نامعتبر';
document.getElementById('rentDetail').innerHTML = '';
return;
}

// تبدیل رهن به اجاره: هر 100 میلیون = 3 میلیون
const equivalentRent = (deposit / 100000000) * 3000000;
const totalBaseRent = equivalentRent + monthlyRent;
const commission = totalBaseRent * 0.25; // یک چهارم
const tax = commission * 0.10; // 10%
const total = commission + tax;

document.getElementById('rentTotal').innerHTML = formatNumber(total) + ' تومان';
document.getElementById('rentDetail').innerHTML = مبلغ پایه اجاره: ${formatNumber(totalBaseRent)} | کمیسیون: ${formatNumber(commission)} | مالیات: ${formatNumber(tax)};
}

// ==================== تعویض تب ====================
const saleTabBtn = document.getElementById('saleTabBtn');
const rentTabBtn = document.getElementById('rentTabBtn');
const saleCalc = document.getElementById('saleCalculator');
const rentCalc = document.getElementById('rentCalculator');

saleTabBtn.addEventListener('click', () => {
saleTabBtn.classList.add('active');
rentTabBtn.classList.remove('active');
saleCalc.style.display = 'block';
rentCalc.style.display = 'none';
});

rentTabBtn.addEventListener('click', () => {
rentTabBtn.classList.add('active');
saleTabBtn.classList.remove('active');
saleCalc.style.display = 'none';
rentCalc.style.display = 'block';
});

// دکمه‌های محاسبه
document.getElementById('calcSaleBtn').addEventListener('click', calculateSale);
document.getElementById('calcRentBtn').addEventListener('click', calculateRent);

// محاسبه خودکار با اینتر (فروش)
document.getElementById('saleAmount').addEventListener('keypress', (e) => {
if (e.key === 'Enter') calculateSale();
});
document.getElementById('rentDeposit').addEventListener('keypress', (e) => {
if (e.key === 'Enter') calculateRent();
});
document.getElementById('rentMonthly').addEventListener('keypress', (e) => {
if (e.key === 'Enter') calculateRent();
});
</script>
</body>
</html>
