<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین قهرمان - قیمت لحظه‌ای</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            font-family: system-ui, 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #facc15;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            text-shadow: 0 2px 10px rgba(250,204,21,0.2);
        }
        .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            border-bottom: 1px dashed #334155;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
            margin-top: 1rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: #facc1540;
            transform: translateY(-5px);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            border-right: 3px solid #facc15;
            padding-right: 1rem;
        }
        .emoji {
            font-size: 2rem;
        }
        h2 {
            color: #f1f5f9;
            font-size: 1.6rem;
        }
        .price {
            font-size: 2.2rem;
            font-weight: 800;
            color: #facc15;
            margin: 0.8rem 0;
            letter-spacing: 1px;
            word-break: break-word;
        }
        .update-time {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 1rem;
            border-top: 1px solid #334155;
            padding-top: 0.8rem;
        }
        .badge {
            background: #0f172a;
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 8px;
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            color: #475569;
            font-size: 0.75rem;
        }
        @media (max-width: 640px) {
            .price { font-size: 1.4rem; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🇮🇷 ماشین قهرمان 🇮🇷</h1>
    <div style="text-align: center;">
        <div class="sub">💎 قیمت‌های لحظه‌ای بازار جهانی</div>
    </div>

    <div class="grid" id="dashboard">
        <div class="card">
            <div class="card-header">
                <div class="emoji">💵</div>
                <h2>دلار آمریکا</h2>
            </div>
            <div class="price" id="usd-price">در حال دریافت...</div>
            <div class="badge">USD/IRR</div>
            <div class="update-time" id="usd-time"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="emoji">🥇</div>
                <h2>طلا (اونس)</h2>
            </div>
            <div class="price" id="gold-price">در حال دریافت...</div>
            <div class="badge">XAU/USD</div>
            <div class="update-time" id="gold-time"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="emoji">₿</div>
                <h2>بیت‌کوین</h2>
            </div>
            <div class="price" id="btc-price">در حال دریافت...</div>
            <div class="badge">BTC/USD</div>
            <div class="update-time" id="btc-time"></div>
        </div>
    </div>
    <footer>
        ⚡ قیمت‌ها هر 60 ثانیه به‌روز می‌شوند | منبع: Mobal / CoinGecko / Binance
    </footer>
</div>

<script>
    // نمایش زمان بروزرسانی
    function updateTime(elementId) {
        const now = new Date();
        const timeString = now.toLocaleTimeString('fa-IR');
        const timeElement = document.getElementById(elementId);
        if (timeElement) {
            timeElement.innerHTML = `🕒 آخرین بروزرسانی: ${timeString}`;
        }
    }

    // 1. قیمت دلار (از api مبال)
    async function getUSDRialPrice() {
        try {
            // استفاده از API مبال (مخصوص قیمت دلار ایران)
            const response = await fetch('https://api.mobal.ir/api/currency');
            if (response.ok) {
                const data = await response.json();
                // ساختار پاسخ مبال: data.price یا data.USD
                let price = data.price || data.USD || 60000;
                if (typeof price === 'number') {
                    document.getElementById('usd-price').innerHTML = price.toLocaleString('fa-IR') + ' ریال';
                    updateTime('usd-time');
                    return true;
                }
            }
            throw new Error('API مبال پاسخ نداد');
        } catch(e) {
            console.log('USD Error:', e);
            // Fallback: از exchangerate.host
            try {
                const response2 = await fetch('https://api.exchangerate.host/latest?base=USD&symbols=IRR');
                if (response2.ok) {
                    const data2 = await response2.json();
                    const price = Math.floor(data2.rates.IRR);
                    document.getElementById('usd-price').innerHTML = price.toLocaleString('fa-IR') + ' ریال';
                    updateTime('usd-time');
                    return true;
                }
            } catch(e2) {
                document.getElementById('usd-price').innerHTML = '❌ ۶۰,۰۰۰ ریال (تخمینی)';
                updateTime('usd-time');
            }
            return false;
        }
    }

    // 2. قیمت طلا (از gold-api)
    async function getGoldPrice() {
        try {
            const response = await fetch('https://api.gold-api.com/price/XAU');
            if (response.ok) {
                const data = await response.json();
                let price = data.price || data.USD || 2350;
                if (typeof price === 'number') {
                    document.getElementById('gold-price').innerHTML = '$ ' + price.toLocaleString('fa-IR');
                    updateTime('gold-time');
                    return true;
                }
            }
            throw new Error('Gold API failed');
        } catch(e) {
            console.log('Gold Error:', e);
            // Fallback: از metals-api
            try {
                const response2 = await fetch('https://metals-api.com/api/latest?access_key=demo&base=USD&symbols=XAU');
                if (response2.ok) {
                    const data2 = await response2.json();
                    const price = data2.rates?.XAU || 2350;
                    document.getElementById('gold-price').innerHTML = '$ ' + price.toLocaleString('fa-IR');
                    updateTime('gold-time');
                    return true;
                }
            } catch(e2) {
                document.getElementById('gold-price').innerHTML = '$ ۲,۳۵۰ (تخمینی)';
                updateTime('gold-time');
            }
            return false;
        }
    }

    // 3. قیمت بیت‌کوین (از CoinGecko - بدون نیاز به API key)
    async function getBitcoinPrice() {
        try {
            const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
            if (response.ok) {
                const data = await response.json();
                const price = data.bitcoin?.usd || 60000;
                document.getElementById('btc-price').innerHTML = '$ ' + price.toLocaleString('fa-IR');
                updateTime('btc-time');
                return true;
            }
            throw new Error('CoinGecko failed');
        } catch(e) {
            console.log('BTC Error:', e);
            // Fallback: از Binance
            try {
                const response2 = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
                if (response2.ok) {
                    const data2 = await response2.json();
                    const price = parseFloat(data2.price);
                    document.getElementById('btc-price').innerHTML = '$ ' + price.toLocaleString('fa-IR');
                    updateTime('btc-time');
                    return true;
                }
            } catch(e2) {
                document.getElementById('btc-price').innerHTML = '$ ۶۰,۰۰۰ (تخمینی)';
                updateTime('btc-time');
            }
            return false;
        }
    }

    // اجرای همزمان همه
    async function fetchAllPrices() {
        await Promise.all([
            getUSDRialPrice(),
            getGoldPrice(),
            getBitcoinPrice()
        ]);
    }

    // بار اول اجرا
    fetchAllPrices();

    // هر 60 ثانیه آپدیت
    setInterval(fetchAllPrices, 60000);
</script>
</body>
</html>
