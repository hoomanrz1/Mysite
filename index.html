<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ایران قهرمان</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Tahoma', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 { color: #764ba2; }
        p { color: #333; font-size: 18px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🇮🇷 ایران قهرمان 🇮🇷</h1>
        <p>این سایت با ❤️ ساخته شده</p>
        <p>روی گیت‌هاب هاست شده</p>
        <p>با دامنه شخصی خودم !</p>
    </div>
</body>
</html>
