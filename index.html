<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین قهرمان - قیمت لحظه‌ای ارزها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            font-family: system-ui, 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #facc15;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            text-shadow: 0 2px 10px rgba(250,204,21,0.2);
        }
        .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            border-bottom: 1px dashed #334155;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
            margin-top: 1rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: #facc1540;
            transform: translateY(-5px);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            border-right: 3px solid #facc15;
            padding-right: 1rem;
        }
        .emoji {
            font-size: 2rem;
        }
        h2 {
            color: #f1f5f9;
            font-size: 1.6rem;
        }
        .price {
            font-size: 2.2rem;
            font-weight: 800;
            color: #facc15;
            margin: 0.8rem 0;
            letter-spacing: 1px;
        }
        .update-time {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 1rem;
            border-top: 1px solid #334155;
            padding-top: 0.8rem;
        }
        .loader {
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        .badge {
            background: #0f172a;
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 8px;
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            color: #475569;
            font-size: 0.75rem;
        }
        @media (max-width: 640px) {
            .price { font-size: 1.6rem; }
            h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🇮🇷 ماشین قهرمان 🇮🇷</h1>
    <div style="text-align: center;">
        <div class="sub">💎 قیمت‌های لحظه‌ای بازار جهانی</div>
    </div>

    <div class="grid" id="dashboard">
        <!-- کارت دلار -->
        <div class="card">
            <div class="card-header">
                <div class="emoji">💵</div>
                <h2>دلار آمریکا</h2>
            </div>
            <div class="price" id="usd-price">---</div>
            <div class="badge">USD/IRR</div>
            <div class="update-time" id="usd-time"></div>
        </div>

        <!-- کارت طلا -->
        <div class="card">
            <div class="card-header">
                <div class="emoji">🥇</div>
                <h2>طلا (اونس)</h2>
            </div>
            <div class="price" id="gold-price">---</div>
            <div class="badge">XAU/USD</div>
            <div class="update-time" id="gold-time"></div>
        </div>

        <!-- کارت بیت‌کوین -->
        <div class="card">
            <div class="card-header">
                <div class="emoji">₿</div>
                <h2>بیت‌کوین</h2>
            </div>
            <div class="price" id="btc-price">---</div>
            <div class="badge">BTC/USD</div>
            <div class="update-time" id="btc-time"></div>
        </div>
    </div>
    <footer>
        ⚡ قیمت‌ها هر 60 ثانیه یکبار به‌روز می‌شوند | منبع: live-rates.com
    </footer>
</div>

<script>
    // -----------------------------------------------
    // تنظیمات اولیه
    // -----------------------------------------------
    const USD_PAIR = 'USDIRR';     // دلار به ریال
    const GOLD_PAIR = 'XAUUSD';    // طلا به دلار
    const BTC_PAIR = 'BTCUSD';     // بیت‌کوین به دلار

    const API_BASE = 'https://www.live-rates.com/api/price?key=&rate=';

    // -----------------------------------------------
    // تابع دریافت چند نماد با یک درخواست
    // -----------------------------------------------
    async function fetchRates() {
        try {
            // یکباره هر سه تا نماد رو میگیریم
            const symbols = `${USD_PAIR},${GOLD_PAIR},${BTC_PAIR}`;
            const url = `${API_BASE}${symbols}`;
            
            const response = await fetch(url);
            if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
            
            const data = await response.json();
            updateUI(data);
        } catch (error) {
            console.error('مشکل در ارتباط با سرور:', error);
            showErrorOnCards();
        }
    }

    // -----------------------------------------------
    // نمایش قیمت‌ها در کارت‌ها
    // -----------------------------------------------
    function updateUI(ratesArray) {
        if (!Array.isArray(ratesArray)) {
            console.warn('فرمت داده نامعتبر');
            return;
        }

        const now = new Date();
        const timeString = now.toLocaleTimeString('fa-IR');

        ratesArray.forEach(item => {
            const currency = item.currency;   // مثلاً "USDIRR"
            const rate = parseFloat(item.rate);
            if (isNaN(rate)) return;

            // بر اساس نماد مقداردهی کن
            if (currency === USD_PAIR) {
                const usdElem = document.getElementById('usd-price');
                if (usdElem) {
                    // قیمت دلار رو با کاما جدا کن
                    usdElem.innerText = new Intl.NumberFormat('fa-IR').format(rate) + ' ریال';
                }
                const usdTime = document.getElementById('usd-time');
                if (usdTime) usdTime.innerText = `🕒 آخرین بروزرسانی: ${timeString}`;
            }
            else if (currency === GOLD_PAIR) {
                const goldElem = document.getElementById('gold-price');
                if (goldElem) {
                    goldElem.innerText = '$ ' + new Intl.NumberFormat('fa-IR').format(rate);
                }
                const goldTime = document.getElementById('gold-time');
                if (goldTime) goldTime.innerText = `🕒 آخرین بروزرسانی: ${timeString}`;
            }
            else if (currency === BTC_PAIR) {
                const btcElem = document.getElementById('btc-price');
                if (btcElem) {
                    btcElem.innerText = '$ ' + new Intl.NumberFormat('fa-IR').format(rate);
                }
                const btcTime = document.getElementById('btc-time');
                if (btcTime) btcTime.innerText = `🕒 آخرین بروزرسانی: ${timeString}`;
            }
        });
    }

    // -----------------------------------------------
    // اگر خطایی رخ داد، پیام خطا نشون بده
    // -----------------------------------------------
    function showErrorOnCards() {
        const fallbackText = '❌ خطا در دریافت';
        const ids = ['usd-price', 'gold-price', 'btc-price'];
        ids.forEach(id => {
            const el = document.getElementById(id);
            if (el && el.innerText === '---') el.innerText = fallbackText;
        });
    }

    // -----------------------------------------------
    // بارگذاری اولیه + آپدیت هر 60 ثانیه
    // -----------------------------------------------
    fetchRates();               // اولین بار فوری بگیر
    setInterval(fetchRates, 60000);   // هر دقیقه بروز کن
</script>
</body>
</html>
