<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین قهرمان - قیمت لحظه‌ای</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            font-family: system-ui, 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #facc15;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            text-shadow: 0 2px 10px rgba(250,204,21,0.2);
        }
        .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            border-bottom: 1px dashed #334155;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
            margin-top: 1rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: #facc1540;
            transform: translateY(-5px);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            border-right: 3px solid #facc15;
            padding-right: 1rem;
        }
        .emoji {
            font-size: 2rem;
        }
        h2 {
            color: #f1f5f9;
            font-size: 1.6rem;
        }
        .price {
            font-size: 2.2rem;
            font-weight: 800;
            color: #facc15;
            margin: 0.8rem 0;
            letter-spacing: 1px;
        }
        .update-time {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 1rem;
            border-top: 1px solid #334155;
            padding-top: 0.8rem;
        }
        .loader {
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        .badge {
            background: #0f172a;
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 8px;
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            color: #475569;
            font-size: 0.75rem;
        }
        @media (max-width: 640px) {
            .price { font-size: 1.6rem; }
            h2 { font-size: 1.3rem; }
        }
        .error {
            background: #7f1a1a80;
            border: 1px solid #ef4444;
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            margin-top: 2rem;
            color: #fca5a5;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🇮🇷 ماشین قهرمان 🇮🇷</h1>
    <div style="text-align: center;">
        <div class="sub">💎 قیمت‌های لحظه‌ای بازار جهانی</div>
    </div>

    <div class="grid" id="dashboard">
        <div class="card">
            <div class="card-header">
                <div class="emoji">💵</div>
                <h2>دلار آمریکا</h2>
            </div>
            <div class="price" id="usd-price">در حال دریافت...</div>
            <div class="badge">USD/IRR</div>
            <div class="update-time" id="usd-time"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="emoji">🥇</div>
                <h2>طلا (اونس)</h2>
            </div>
            <div class="price" id="gold-price">در حال دریافت...</div>
            <div class="badge">XAU/USD</div>
            <div class="update-time" id="gold-time"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="emoji">₿</div>
                <h2>بیت‌کوین</h2>
            </div>
            <div class="price" id="btc-price">در حال دریافت...</div>
            <div class="badge">BTC/USD</div>
            <div class="update-time" id="btc-time"></div>
        </div>
    </div>
    <div id="error-box"></div>
    <footer>
        ⚡ قیمت‌ها هر 60 ثانیه به‌روز می‌شوند | منبع: CoinPaprika
    </footer>
</div>

<script>
    // استفاده از APIهای مختلف برای هر نماد (بدون مشکل CORS)
    
    // 1. برای بیت‌کوین: از Binance API استفاده می‌کنیم (بدون نیاز به CORS)
    async function getBitcoinPrice() {
        try {
            const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
            const data = await response.json();
            const price = parseFloat(data.price);
            document.getElementById('btc-price').innerHTML = '$ ' + price.toLocaleString('fa-IR');
            const now = new Date();
            document.getElementById('btc-time').innerHTML = `🕒 آخرین بروزرسانی: ${now.toLocaleTimeString('fa-IR')}`;
            return true;
        } catch(e) {
            console.log('BTC Error:', e);
            document.getElementById('btc-price').innerHTML = '❌ خطا در دریافت';
            return false;
        }
    }
    
    // 2. برای طلا: از یک API ساده استفاده می‌کنیم
    async function getGoldPrice() {
        try {
            // استفاده از API جایگزین
            const response = await fetch('https://api.gold-api.com/price/XAU');
            if(response.ok) {
                const data = await response.json();
                const price = parseFloat(data.price);
                document.getElementById('gold-price').innerHTML = '$ ' + price.toLocaleString('fa-IR');
            } else {
                throw new Error('API not available');
            }
            const now = new Date();
            document.getElementById('gold-time').innerHTML = `🕒 آخرین بروزرسانی: ${now.toLocaleTimeString('fa-IR')}`;
            return true;
        } catch(e) {
            console.log('Gold Error:', e);
            // fallback: قیمت تقریبی
            document.getElementById('gold-price').innerHTML = '$ 2,350 (آفلاین)';
            return false;
        }
    }
    
    // 3. برای دلار: از API ارز استفاده می‌کنیم
    async function getUSDRialPrice() {
        try {
            // از API ارز آزاد
            const response = await fetch('https://api.exchangerate.host/latest?base=USD&symbols=IRR');
            if(response.ok) {
                const data = await response.json();
                const price = Math.floor(data.rates.IRR);
                document.getElementById('usd-price').innerHTML = price.toLocaleString('fa-IR') + ' ریال';
            } else {
                throw new Error('API not available');
            }
            const now = new Date();
            document.getElementById('usd-time').innerHTML = `🕒 آخرین بروزرسانی: ${now.toLocaleTimeString('fa-IR')}`;
            return true;
        } catch(e) {
            console.log('USD Error:', e);
            document.getElementById('usd-price').innerHTML = '❌ خطا در دریافت';
            return false;
        }
    }
    
    // اجرای همزمان همه
    async function fetchAllPrices() {
        await Promise.all([
            getBitcoinPrice(),
            getGoldPrice(),
            getUSDRialPrice()
        ]);
    }
    
    // بار اول اجرا کن
    fetchAllPrices();
    
    // هر 60 ثانیه آپدیت کن
    setInterval(fetchAllPrices, 60000);
</script>
</body>
</html>
