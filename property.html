<script>
function getIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id');
}

function buildVisitTemplate(title) {
  return `موضوع: درخواست بازدید از ساختمان...........

با سلام و احترام
بدین‌وسیله به استحضار می‌رساند، شرکت ............... در نظر دارد به‌منظور بررسی و ارزیابی ملک معرفی‌شده بازدید به عمل بیاوریم.
لذا هماهنگی‌های لازم جهت فراهم شدن امکان بازدید کارشناسان این شرکت در تاریخ و ساعت مورد توافق انجام پذیرد.

با احترام
نام و سمت نماینده شرکت: ..........................
تعداد بازدید کننده‌ها و اسامی: ..........................
شماره تماس: ..........................
تاریخ: ..........................
مهر و امضا`;
}

function openVisitModal(title) {
  const text = buildVisitTemplate(title);
  document.getElementById('visitTemplateText').value = text;
  document.getElementById('whatsappVisitLink').href = 'https://wa.me/989124096970?text=' + encodeURIComponent(text);
  document.getElementById('visitModal').classList.remove('hidden');
}

function copyVisitText() {
  const textarea = document.getElementById('visitTemplateText');
  textarea.select();
  navigator.clipboard.writeText(textarea.value).then(() => {
    const msg = document.getElementById('copyMsg');
    msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 2000);
  });
}

function normalizeMoneyForConversion(val) {
  let toman = Math.round(parseFloat(val) || 0);
  if (toman > 0 && toman < 1000000) toman = toman * 1000000;
  return toman;
}

function formatTomanPhrase(toman) {
  toman = Math.round(parseFloat(toman) || 0);
  if (toman > 0 && toman < 1000000) toman = toman * 1000000;
  if (toman <= 0) return '—';
  const billion = Math.floor(toman / 1000000000);
  const million = Math.round((toman % 1000000000) / 1000000);
  const parts = [];
  if (billion > 0) parts.push(billion.toLocaleString('fa-IR') + ' میلیارد');
  if (million > 0) parts.push(million.toLocaleString('fa-IR') + ' میلیون');
  if (parts.length === 0) return toman.toLocaleString('fa-IR') + ' تومان';
  return parts.join(' و ') + ' تومان';
}

async function loadProperty() {
  const id = getIdFromUrl();
  const container = document.getElementById('propertyContent');

  if (!id) {
    container.innerHTML = '<p class="text-red-400 text-center py-20">آدرس ملک نامعتبر است.</p>';
    return;
  }

  try {
    const res = await fetch('/api/properties/' + id);
    if (!res.ok) {
      container.innerHTML = '<p class="text-red-400 text-center py-20">این ملک پیدا نشد یا حذف شده است.</p>';
      return;
    }
    const p = await res.json();
    document.title = p.title + ' | املاک راد';

    const priceBlock = p.type === 'sale'
      ? `<span class="text-4xl font-bold text-amber-400">${p.price}</span><span class="text-lg block text-zinc-400">میلیارد تومان</span>`
      : `<div class="flex flex-col gap-1">
           <div><span class="text-xs text-zinc-500">ودیعه</span> <span class="text-2xl font-bold text-amber-400">${formatTomanPhrase(p.deposit)}</span></div>
           <div><span class="text-xs text-zinc-500">اجاره</span> <span class="text-2xl font-bold text-amber-400">${formatTomanPhrase(p.rentAmount)}</span></div>
         </div>`;

    let baseDeposit = 0, baseRent = 0, maxConvertibleToman = 0, maxConvertibleToDepositToman = 0;
    if (p.type === 'rent') {
      baseDeposit = normalizeMoneyForConversion(p.deposit);
      baseRent = normalizeMoneyForConversion(p.rentAmount);
      maxConvertibleToman = normalizeMoneyForConversion(p.maxConvertible);
      maxConvertibleToDepositToman = normalizeMoneyForConversion(p.maxConvertibleToDeposit);
      baseDepositGlobal = baseDeposit;
      baseRentGlobal = baseRent;
      maxConvertibleGlobal = maxConvertibleToman;
      maxConvertibleToDepositGlobal = maxConvertibleToDepositToman;
    }

    const images = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);
    const mainImage = images[0] || 'https://via.placeholder.com/1000x600?text=بدون+عکس';

    const thumbsHtml = images.length > 1 ? `
      <div class="flex gap-3 mt-4 overflow-x-auto pb-2">
        ${images.map((img, idx) => `
          <div class="protected-image-wrap flex-shrink-0 w-24 h-20 rounded-xl overflow-hidden border-2 cursor-pointer thumb-item ${idx === 0 ? 'border-amber-400' : 'border-zinc-800'}" onclick="switchMainImage('${img.replace(/'/g, "\\'")}', this)">
            <img src="${img}" class="protected-image w-full h-full object-cover" alt="عکس ${idx + 1}" oncontextmenu="return false" ondragstart="return false">
          </div>
        `).join('')}
      </div>
    ` : '';

    let divisibleHtml = '';
    if (p.divisible && p.totalFloors && p.areaPerFloor) {
      const totalFloors = parseInt(p.totalFloors);
      const perFloor = parseFloat(p.areaPerFloor);
      let rows = '';
      for (let n = 1; n <= totalFloors; n++) {
        rows += `<div class="flex justify-between border-b border-zinc-800 last:border-0 py-2 text-sm">
          <span>${n} طبقه</span><span class="text-amber-400">${(n * perFloor).toLocaleString('fa-IR')} متر</span>
        </div>`;
      }
      const availabilityLine = p.availableFloorsCount
        ? `<div class="mt-4 pt-4 border-t border-amber-400/20 text-green-400 text-sm font-semibold">
             <i class="fas fa-circle-check ml-1"></i>
             در حال حاضر ${p.availableFloorsCount} طبقه موجود و قابل ${p.type === 'sale' ? 'خرید' : 'اجاره'}ست${p.whichFloors ? ' (' + p.whichFloors + ')' : ''}.
           </div>`
        : (p.whichFloors ? `<div class="mt-4 pt-4 border-t border-amber-400/20 text-green-400 text-sm font-semibold"><i class="fas fa-circle-check ml-1"></i> طبقات موجود: ${p.whichFloors}</div>` : '');
      divisibleHtml = `
        <div class="bg-zinc-900 border border-amber-400/30 rounded-2xl p-6 mb-10">
          <h3 class="font-bold text-amber-400 mb-2"><i class="fas fa-layer-group ml-2"></i>این ملک قابل تفکیک است</h3>
          <p class="text-zinc-400 text-sm mb-4">در مجموع ${totalFloors} طبقه‌ی مستقل، هر طبقه ${perFloor.toLocaleString('fa-IR')} متر — می‌توان به‌صورت جداگانه ${p.type === 'sale' ? 'خریداری' : 'اجاره'} کرد:</p>
          ${rows}
          ${availabilityLine}
        </div>
      `;
    }

    let extraHtml = '';
    if (p.extraFields && p.extraFields.length > 0) {
      extraHtml = p.extraFields.filter(f => f.label || f.value).map(f => `
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
          <div class="text-amber-400 text-sm mb-1">${f.label || ''}</div>
          <div class="text-lg">${f.value || ''}</div>
        </div>
      `).join('');
    }

    let convertibleHtml = '';
    const hasAnyConversion = p.type === 'rent' && p.convertible && (maxConvertibleToman > 0 || maxConvertibleToDepositToman > 0);
    if (hasAnyConversion) {
      convertibleHtml = `
        <div class="bg-zinc-900 border border-amber-400/30 rounded-2xl p-6 mb-10">
          <h3 class="font-bold text-amber-400 mb-4"><i class="fas fa-arrows-up-down ml-2"></i>ودیعه و اجارهٔ این ملک تا حدی قابل تبدیل است.</h3>
          <div class="flex justify-between text-center mb-4">
            <div>
              <div class="text-zinc-400 text-sm">ودیعه (تومان)</div>
              <div id="convDeposit" class="text-2xl font-bold text-amber-400 mt-1">—</div>
            </div>
            <div class="border-r border-zinc-800"></div>
            <div>
              <div class="text-zinc-400 text-sm">اجارهٔ ماهانه (تومان)</div>
              <div id="convRent" class="text-2xl font-bold text-amber-400 mt-1">—</div>
            </div>
          </div>
          <input id="convSlider" type="range" min="-100" max="100" value="0" class="w-full accent-amber-400" oninput="updateConversion()">
          <div class="flex justify-between text-zinc-500 text-xs mt-2">
            <span>${maxConvertibleToDepositToman > 0 ? '← افزایش ودیعه (رهن کامل‌تر)' : ''}</span>
            <span>${maxConvertibleToman > 0 ? 'افزایش اجاره →' : ''}</span>
          </div>
        </div>
      `;
    }

    container.innerHTML = `
      <a href="${p.type === 'sale' ? 'sale.html' : 'rent.html'}" class="inline-flex items-center gap-2 text-amber-400 hover:text-amber-300 mb-8">
        <i class="fas fa-arrow-right"></i> بازگشت به لیست ${p.type === 'sale' ? 'فروش' : 'اجاره'}
      </a>
      <div class="protected-image-wrap rounded-3xl overflow-hidden mb-2 border border-zinc-800 bg-zinc-900 flex items-center justify-center">
        <img id="mainPropertyImage" src="${mainImage}" class="protected-image w-full max-h-[550px] object-contain" alt="${p.title}" oncontextmenu="return false" ondragstart="return false">
      </div>
      ${thumbsHtml}
      ${divisibleHtml}
      <div class="flex flex-col md:flex-row justify-between md:items-center gap-6 mb-10 mt-8">
        <div>
          <span class="text-xs font-bold bg-amber-400/10 text-amber-400 px-4 py-2 rounded-2xl">${p.badge || (p.type === 'sale' ? 'فروش' : 'اجاره')}</span>
          <h1 class="text-4xl font-bold mt-4">${p.title}</h1>
          <p class="text-zinc-400 text-lg mt-2"><i class="fas fa-location-dot ml-1"></i> ${p.location || ''}</p>
        </div>
        <div class="text-left">${priceBlock}</div>
      </div>
      ${convertibleHtml}
      <div class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-10">
        ${p.units ? `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-center"><i class="fas fa-building text-amber-400 mb-2"></i><div>${p.units}</div></div>` : ''}
        ${p.area ? `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-center"><i class="fas fa-vector-square text-amber-400 mb-2"></i><div>${p.area} متر</div></div>` : ''}
        ${p.floor ? `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-center"><i class="fas fa-layer-group text-amber-400 mb-2"></i><div>${p.floor}</div></div>` : ''}
        ${p.parking ? `<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 text-center"><i class="fas fa-square-parking text-amber-400 mb-2"></i><div>${p.parking}</div></div>` : ''}
      </div>
      ${extraHtml ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10">${extraHtml}</div>` : ''}
      <button onclick="openVisitModal('${(p.title || '').replace(/'/g, "\\'")}')"
        class="w-full luxury-btn bg-amber-400 hover:bg-amber-300 text-black font-bold text-lg py-5 rounded-2xl">
        <i class="fas fa-calendar-check ml-2"></i> هماهنگی برای بازدید این ملک
      </button>
    `;

    if (hasAnyConversion) {
      updateConversion();
    }
  } catch (err) {
    container.innerHTML = '<p class="text-red-400 text-center py-20">خطا در بارگذاری اطلاعات ملک.</p>';
  }
}

const RENT_RATIO = 0.03; // مطابق محاسبه‌گر رهن به اجاره
let baseDepositGlobal = 0, baseRentGlobal = 0, maxConvertibleGlobal = 0, maxConvertibleToDepositGlobal = 0;

function updateConversion() {
  const slider = document.getElementById('convSlider');
  if (!slider) return;
  const percent = parseFloat(slider.value) / 100; // بین -۱ و +۱
  let newDeposit, newRent;

  if (percent >= 0) {
    // سمت راست: کم‌کردن از ودیعه، اضافه‌کردن به اجاره
    const convertedAmount = maxConvertibleGlobal * percent;
    newDeposit = baseDepositGlobal - convertedAmount;
    newRent = baseRentGlobal + (convertedAmount * RENT_RATIO);
  } else {
    // سمت چپ: کم‌کردن از اجاره، اضافه‌کردن به ودیعه
    const rentReduction = maxConvertibleToDepositGlobal * (-percent);
    newRent = baseRentGlobal - rentReduction;
    newDeposit = baseDepositGlobal + (rentReduction / RENT_RATIO);
  }

  document.getElementById('convDeposit').textContent = formatTomanPhrase(newDeposit);
  document.getElementById('convRent').textContent = formatTomanPhrase(newRent);
}

function switchMainImage(url, thumbEl) {
  document.getElementById('mainPropertyImage').src = url;
  document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('border-amber-400'));
  document.querySelectorAll('.thumb-item').forEach(t => t.classList.add('border-zinc-800'));
  thumbEl.classList.remove('border-zinc-800');
  thumbEl.classList.add('border-amber-400');
}

// جلوگیری از راست‌کلیک و درگ‌کردن روی کل صفحه (به‌خصوص عکس‌ها)
document.addEventListener('contextmenu', function(e) {
  if (e.target.tagName === 'IMG') e.preventDefault();
});
document.addEventListener('dragstart', function(e) {
  if (e.target.tagName === 'IMG') e.preventDefault();
});

loadProperty();
</script>
