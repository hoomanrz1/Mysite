<!-- Page Header -->
<section class="pt-40 pb-10 bg-zinc-950 text-center">
<h1 class="text-5xl md:text-6xl font-black mb-4">املاک <span class="gold-gradient">برای اجاره</span></h1>
<p class="text-xl text-zinc-400 max-w-2xl mx-auto">مجموعه‌ای از بهترین املاک لوکس آماده اجاره</p>
</section>

<!-- Filters -->
<section class="pb-8 px-6">
<div class="max-w-6xl mx-auto bg-zinc-900 border border-zinc-800 rounded-3xl p-6">
<div class="grid grid-cols-1 md:grid-cols-4 gap-4">
<div class="md:col-span-2">
<label class="block text-amber-400 text-sm mb-2">جستجو (عنوان، منطقه یا عبارت خاص)</label>
<input id="filterSearch" type="text" placeholder="مثلا: جردن یا دوبلکس" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl py-3 px-4" oninput="applyFilters()">
</div>
<div>
<label class="block text-amber-400 text-sm mb-2">منطقه</label>
<select id="filterLocation" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl py-3 px-4" onchange="applyFilters()">
<option value="">همه مناطق</option>
</select>
</div>
<div>
<label class="block text-amber-400 text-sm mb-2">بازه متراژ (متر)</label>
<div class="flex gap-2 items-center">
<input id="filterAreaMin" type="number" placeholder="از" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl py-3 px-4" oninput="applyFilters()">
<span class="text-zinc-500">تا</span>
<input id="filterAreaMax" type="number" placeholder="تا" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl py-3 px-4" oninput="applyFilters()">
</div>
</div>
</div>
</div>
</section>

<!-- Rent Properties -->
<section class="py-8 bg-zinc-950">
<div class="max-w-7xl mx-auto px-8">
<div id="propertiesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
<p class="text-zinc-500 col-span-full text-center">در حال بارگذاری املاک...</p>
</div>
</div>
</section>

<!-- Footer -->
<footer class="bg-black py-20 border-t border-zinc-900">

<div class="flex items-center gap-4">
<div class="text-3xl font-bold">املاک راد</div>
</div>
<div class="text-center md:text-right">
<p>تلفن تماس: <span class="text-amber-400">۰۹۱۲۴۰۹۶۹۷۰</span></p>
<p class="text-zinc-500 text-sm mt-2">© ۱۴۰۵ املاک راد - تمامی حقوق محفوظ است</p>
</div>
</div>
</div>
</footer>

<script>
let allRentProperties = [];

function renderCards(properties) {
  const grid = document.getElementById('propertiesGrid');
  if (properties.length === 0) {
    grid.innerHTML = '<p class="text-zinc-500 col-span-full text-center">ملکی با این مشخصات پیدا نشد.</p>';
    return;
  }
  grid.innerHTML = properties.map(p => `
    <a href="property.html?id=${p.id}" class="property-card bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800 block">
      <div class="relative">
        <img src="${(p.images && p.images[0]) || p.image || 'https://via.placeholder.com/600x400?text=بدون+عکس'}" class="w-full h-80 object-cover" alt="${p.title}" oncontextmenu="return false" ondragstart="return false" style="-webkit-touch-callout: none;">
        <div class="absolute top-6 right-6 bg-black/70 text-amber-400 text-xs font-bold px-5 py-2 rounded-2xl">${p.badge || 'مستغلات اجاره'}</div>
      </div>
      <div class="p-8">
        <div class="flex justify-between">
          <div>
            <h3 class="text-2xl font-semibold">${p.title}</h3>
            <p class="text-zinc-400 mt-1">${p.location || ''}</p>
          </div>
          <div class="text-left">
            <span class="text-lg font-bold text-amber-400">ودیعه ${p.deposit}</span>
            <span class="text-sm block">اجاره ${p.rentAmount}</span>
          </div>
        </div>
        <div class="flex flex-wrap gap-6 mt-8 text-zinc-400 text-sm">
          ${p.units ? `<div>${p.units}</div>` : ''}
          ${p.floor ? `<div>${p.floor}</div>` : ''}
          ${p.parking ? `<div>${p.parking}</div>` : ''}
        </div>
      </div>
    </a>
  `).join('');
}

function populateLocationFilter(properties) {
  const select = document.getElementById('filterLocation');
  const locations = [...new Set(properties.map(p => p.location).filter(Boolean))];
  select.innerHTML = '<option value="">همه مناطق</option>' + locations.map(loc => `<option value="${loc}">${loc}</option>`).join('');
}

function applyFilters() {
  const search = document.getElementById('filterSearch').value.trim().toLowerCase();
  const location = document.getElementById('filterLocation').value;
  const minArea = parseFloat(document.getElementById('filterAreaMin').value);
  const maxArea = parseFloat(document.getElementById('filterAreaMax').value);

  let filtered = allRentProperties.filter(p => {
    const matchesSearch = !search || (p.title || '').toLowerCase().includes(search) || (p.location || '').toLowerCase().includes(search) || (p.badge || '').toLowerCase().includes(search);
    const matchesLocation = !location || p.location === location;
    const propertyArea = parseFloat(p.area);
    const matchesAreaMin = isNaN(minArea) || (!isNaN(propertyArea) && propertyArea >= minArea);
    const matchesAreaMax = isNaN(maxArea) || (!isNaN(propertyArea) && propertyArea <= maxArea);
    return matchesSearch && matchesLocation && matchesAreaMin && matchesAreaMax;
  });

  renderCards(filtered);
}

async function loadRentProperties() {
  const grid = document.getElementById('propertiesGrid');
  try {
    const res = await fetch('/api/properties?type=rent');
    allRentProperties = await res.json();
    populateLocationFilter(allRentProperties);
    renderCards(allRentProperties);
  } catch (err) {
    grid.innerHTML = '<p class="text-red-400 col-span-full text-center">خطا در بارگذاری املاک</p>';
  }
}

loadRentProperties();
</script>
